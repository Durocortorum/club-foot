security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        utilisateurs:
            entity:
                class: App\Entity\Utilisateur
                property: email

    role_hierarchy:
        ROLE_ADMIN: [ROLE_ECOLE_FOOT, ROLE_PREFORMATION, ROLE_FORMATION, ROLE_ELITE, ROLE_PRO, ROLE_INFIRMERIE, ROLE_VISITE_MEDICALE, ROLE_RAPPORT_MATCH, ROLE_SCOLAIRE, ROLE_TESTS_PHYSIQUES]
        # Sections à deux niveaux : « modifier » inclut « voir ».
        ROLE_INFIRMERIE: [ROLE_INFIRMERIE_LECTURE]
        ROLE_VISITE_MEDICALE: [ROLE_VISITE_MEDICALE_LECTURE]
        ROLE_SCOLAIRE: [ROLE_SCOLAIRE_LECTURE]
        ROLE_TESTS_PHYSIQUES: [ROLE_TESTS_PHYSIQUES_LECTURE]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|css|images|js)/)
            security: false
        main:
            lazy: true
            provider: utilisateurs
            form_login:
                login_path: app_connexion
                check_path: app_connexion
                username_parameter: email
                password_parameter: mot_de_passe
                enable_csrf: true
                default_target_path: app_accueil
            logout:
                path: app_deconnexion
                target: app_connexion
            login_throttling:
                max_attempts: 5
            # Page explicative au lieu de l'erreur 403 brute (compte famille sur une page de l'encadrement...).
            access_denied_handler: App\Security\AccesRefuse

    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/inscription, roles: PUBLIC_ACCESS }
        # Logo et icône du club : affichés sur la page de connexion.
        - { path: ^/club/(logo|icone)/, roles: PUBLIC_ACCESS }
        # Lien d'activation d'un compte famille, reçu par e-mail ou message.
        - { path: ^/activation/, roles: PUBLIC_ACCESS }
        # Mot de passe oublié : demande du lien, puis choix du nouveau mot de passe.
        - { path: ^/mot-de-passe(-oublie$|/), roles: PUBLIC_ACCESS }
        # Pages ouvertes aux comptes famille (joueurs, parents). L'accueil les renvoie vers leur espace.
        - { path: ^/(espace|mon-compte|deconnexion)(/|$), roles: ROLE_USER }
        - { path: ^/$, roles: ROLE_USER }
        # Tout le reste est réservé à l'encadrement du club.
        - { path: ^/, roles: ROLE_ENCADREMENT }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

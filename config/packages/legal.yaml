# Informations légales affichées dans les mentions légales, les CGU, les CGV et la politique de confidentialité.
# À compléter ici, une seule fois : une valeur à ~ (vide) s'affiche « [à compléter] » sur les pages.
# Changer « version » quand le texte des conditions change : la date d'acceptation de chacun reste enregistrée.
parameters:
    legal:
        version: '2026-11-16'
        service: 'Club Foot'                       # nom commercial de l'application (à remplacer par le nom choisi)
        site: 'club.descotesmichel.com'
        editeur: 'Michel Descotes'                 # personne ou société qui édite et vend l'application
        statut: 'entrepreneur indépendant'
        siret: '920 233 772 00010'
        tva: 'FR42920233772'                       # n° de TVA intracommunautaire
        prix_tva: 'TVA non applicable, article 293 B du CGI.'                               # mention des prix dans les CGV : « Prix hors taxes, TVA en sus au taux en vigueur. » ou « TVA non applicable, article 293 B du CGI. »
        adresse: '2 place du 24e RI, 08190 Blanzy-la-Salonnaise'
        email: 'contact@descotesmichel.com'
        telephone: '06 29 68 22 92'
        directeur_publication: 'Michel Descotes'
        hebergeur: 'Hostinger International Ltd'
        hebergeur_adresse: '61 Lordou Vironos Street, 6023 Larnaca, Chypre'
        hebergeur_site: 'www.hostinger.fr'
        hebergement_lieu: 'Pays-Bas (Union européenne)'   # serveur nl-srv-web929.main-hosting.eu
        tribunal: 'Charleville-Mézières'           # ville du tribunal compétent (litige entre professionnels) : à confirmer
        essai_jours: 30                            # durée de l'essai gratuit après l'inscription d'un club
        # € par mois et par club, jusqu'à « seuil_licencies » licenciés ; au-delà, prix « grand club ». À la saison : 10 mois.
        formules:
            - { nom: 'Essentiel', public: 'la vie de chaque semaine : éducateurs et familles', prix: 20, grand: 30 }
            - { nom: 'Club', public: 'gérer le club : président, trésorier, secrétaire (Essentiel compris)', prix: 40, grand: 60 }
            - { nom: 'Formation', public: 'faire progresser les joueurs : responsable technique, clubs formateurs (Club compris)', prix: 65, grand: 95 }
        seuil_licencies: 300
        mois_saison: 10

twig:
    globals:
        legal: '%legal%'

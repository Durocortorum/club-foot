# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    annotations: false
    http_method_override: false
    handle_all_throwables: true
    csrf_protection: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # « Mot de passe oublié » : quelques demandes seulement par adresse IP, contre les envois en rafale.
    rate_limiter:
        mot_de_passe_oublie:
            policy: fixed_window
            lock_factory: null
            limit: 5
            interval: '15 minutes'

when@test:
    framework:
        test: true
        # HelloAsso simulé : aucun appel réseau pendant les tests.
        http_client:
            mock_response_factory: App\Tests\Simulation\HelloAssoSimule
        rate_limiter:
            mot_de_passe_oublie:
                policy: no_limit
                lock_factory: null
        session:
            storage_factory_id: session.storage.factory.mock_file
